		<rect x="40.6" y="30.1" width="2.8" height="6.3" rx="1.4" fill="#fff" opacity=".92"/>
		<path d="M26.3 32.2 62 48.6" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
		<path d="M26.3 32.2 62 48.6" stroke="#F43F5E" stroke-width="5.1" stroke-linecap="round"/>
	</g>

