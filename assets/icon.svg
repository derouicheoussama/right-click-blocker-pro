<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256">
	<!-- Infinity RCB Pro — icône officielle (charte v3) : bouclier à bande
	     dégradée bleu → violet, panneau intérieur blanc, souris bleu nuit
	     droite avec molette, barre d'interdiction rouge → rose détourée. -->
	<defs>
		<linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#1E6FF0"/>
			<stop offset="1" stop-color="#7C3AED"/>
		</linearGradient>
		<linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#FF4D3D"/>
			<stop offset="1" stop-color="#F4156C"/>
		</linearGradient>
	</defs>
	<path d="M13 10h22v13c0 8.6-4.7 14.7-11 17.3C17.7 37.7 13 31.6 13 23Z" fill="url(#band)"/>
	<path d="M16.4 13.2h15.2v9.6c0 6.7-3.5 11.3-7.6 13.6-4.1-2.3-7.6-6.9-7.6-13.6Z" fill="#ffffff"/>
	<rect x="19.6" y="15.6" width="8.8" height="14.2" rx="4.4" fill="#0B0F1E"/>
	<rect x="23.2" y="17.2" width="1.6" height="3.6" rx=".8" fill="#ffffff" opacity=".92"/>
	<path d="M15 18.4 35.4 27.8" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
	<path d="M15 18.4 35.4 27.8" stroke="url(#slash)" stroke-width="2.9" stroke-linecap="round"/>
</svg>
